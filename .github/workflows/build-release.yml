name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller pinpoint.spec

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          iscc "/DAppVersion=${{ github.ref_name }}" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PinPoint ${{ github.ref_name }}
          files: |
            PinPoint-Setup.exe
            dist/PinPoint.exe
          body: |
            ## PinPoint ${{ github.ref_name }} — Windows Desktop

            ### Easy install
            Download **PinPoint-Setup.exe** and run it. Creates a Start Menu entry and optional desktop shortcut.

            ### Manual / portable
            Download **PinPoint.exe** and run it directly from anywhere.

            ### Requirements
            Both require [Ollama](https://ollama.com) installed and running with a model:
            ```
            ollama pull llama3.3
            ```

            ### Controls
            | | |
            |---|---|
            | Just speak | Voice input (mic auto-listens) |
            | Enter | Start autonomous build session |
            | /mute /unmute | Toggle TTS |
            | /dev | Self-improvement mode |
            | /sandbox | Upgrade the 3D viewer |

            ---

            ### Mobile (iOS / Android)
            Visit **https://cj1014.github.io/Pinpoint** → tap Share → Add to Home Screen
            Free API key at [console.groq.com](https://console.groq.com)
