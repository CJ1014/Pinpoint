<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinPoint Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .header button:hover {
            background: rgba(255,255,255,0.3);
        }
        .config-panel {
            padding: 15px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: none;
        }
        .config-panel.show {
            display: block;
        }
        .config-panel input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .config-panel button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .config-panel button:hover {
            background: #764ba2;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.assistant {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 15px 20px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-area button:hover {
            background: #764ba2;
        }
        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            font-size: 12px;
            color: #999;
            padding: 0 20px 15px;
            text-align: center;
        }
        .typing {
            display: inline-block;
        }
        .typing span {
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.5; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-5px); }
        }
        .voice-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .voice-btn:hover {
            background: #ff5252;
        }
        .voice-btn.recording {
            background: #ff3333;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
            background: #ffe0e0;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PinPoint Web</h1>
            <button id="settingsBtn">⚙️ Settings</button>
        </div>

        <div class="config-panel" id="configPanel">
            <h3>Ollama Configuration</h3>
            <input type="text" id="ollamaUrl" placeholder="Ollama URL (e.g., http://192.168.1.100:11434 or http://localhost:11434)" value="http://localhost:11434">
            <input type="text" id="modelName" placeholder="Model name (e.g., qwen2.5-coder:14b)" value="qwen2.5-coder:14b">
            <button onclick="saveConfig()">Save & Connect</button>
            <div id="configStatus" style="margin-top: 10px; font-size: 12px;"></div>
        </div>

        <div id="errorMsg" class="error" style="display: none; margin: 10px 20px 0;"></div>

        <div class="chat-area" id="chatArea"></div>

        <div class="status" id="status">Connecting...</div>

        <div class="input-area">
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Hold to record">🎤 Voice</button>
            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let ollamaUrl = localStorage.getItem('ollamaUrl') || 'http://localhost:11434';
        let modelName = localStorage.getItem('modelName') || 'qwen2.5-coder:14b';
        let isConnected = false;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        document.getElementById('ollamaUrl').value = ollamaUrl;
        document.getElementById('modelName').value = modelName;

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('configPanel').classList.toggle('show');
        });

        async function saveConfig() {
            ollamaUrl = document.getElementById('ollamaUrl').value;
            modelName = document.getElementById('modelName').value;
            localStorage.setItem('ollamaUrl', ollamaUrl);
            localStorage.setItem('modelName', modelName);
            await testConnection();
        }

        async function testConnection() {
            const statusDiv = document.getElementById('configStatus');
            statusDiv.textContent = 'Testing connection...';
            try {
                const response = await fetch(`${ollamaUrl}/api/tags`);
                if (response.ok) {
                    statusDiv.textContent = '✅ Connected to Ollama!';
                    isConnected = true;
                    document.getElementById('status').textContent = 'Ready';
                    document.getElementById('configPanel').classList.remove('show');
                } else {
                    statusDiv.textContent = '❌ Connection failed';
                    isConnected = false;
                }
            } catch (e) {
                statusDiv.textContent = `❌ Error: ${e.message}`;
                isConnected = false;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            if (!isConnected) {
                showError('Not connected to Ollama. Check settings.');
                return;
            }

            input.value = '';
            addMessage('user', message);
            document.getElementById('status').textContent = 'PinPoint is thinking...';

            try {
                const response = await fetch(`${ollamaUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: modelName,
                        messages: getConversationHistory().concat([{ role: 'user', content: message }]),
                        temperature: 1.0,
                        max_tokens: 500,
                        stream: false,
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                addMessage('assistant', reply);
                document.getElementById('status').textContent = 'Ready';
            } catch (e) {
                showError(`Error: ${e.message}`);
                document.getElementById('status').textContent = 'Error';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addMessage(role, content) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function getConversationHistory() {
            const messages = [];
            const chatArea = document.getElementById('chatArea');
            const msgDivs = chatArea.querySelectorAll('.message');

            msgDivs.forEach(div => {
                const role = div.classList.contains('user') ? 'user' : 'assistant';
                const content = div.querySelector('.message-content').textContent;
                messages.push({ role, content });
            });
            return messages;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        async function toggleVoice() {
            const btn = document.getElementById('voiceBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.addEventListener('dataavailable', (event) => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener('stop', async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        // For now, just indicate voice was recorded
                        document.getElementById('messageInput').value = '[Voice input - transcription not yet implemented]';
                        stream.getTracks().forEach(track => track.stop());
                    });

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.textContent = '⏹️ Stop';
                } catch (e) {
                    showError('Microphone access denied');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤 Voice';
            }
        }

        // Test connection on load
        testConnection();
    </script>
</body>
</html>
