<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PinPoint — Live Mind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000a14; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 18px;
    color: #55ddcc; font-size: 12px; pointer-events: none;
    line-height: 1.9; z-index: 10;
    text-shadow: 0 0 8px #00aa99;
  }
  #hud .label { color: #1a4433; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }
  #goal-text { color: #99ffee; max-width: 380px; word-break: break-word; margin-top: 4px; font-size: 11px; }
  #status-badge {
    display: inline-block; padding: 2px 12px; border-radius: 12px;
    background: #001a22; border: 1px solid #00ccaa; font-size: 11px;
    margin-top: 6px; letter-spacing: 2px; color: #00ffcc;
  }

  #legend {
    position: fixed; top: 18px; right: 18px; color: #2a5544;
    font-size: 11px; pointer-events: none; z-index: 10; line-height: 2.3;
    text-align: right;
  }
  .legend-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px; vertical-align: middle;
    box-shadow: 0 0 4px currentColor;
  }

  #footer {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #1a3344; font-size: 11px; pointer-events: none; letter-spacing: 2px;
  }

  #latest-event {
    position: fixed; bottom: 40px; left: 18px; right: 18px;
    color: #33aacc; font-size: 11px; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 6px #005588;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="label">PinPoint Live</div>
  <div id="session-line">Session #— · Iteration —</div>
  <div id="status-badge">connecting…</div>
  <div style="margin-top:10px;" class="label">Current Goal</div>
  <div id="goal-text">—</div>
  <div style="margin-top:10px;" class="label">Stats</div>
  <div id="stats-line">Events: — | Files: — | Memories: —</div>
</div>

<div id="legend">
  <div><span class="legend-dot" style="background:#8855ff;color:#8855ff"></span>think</div>
  <div><span class="legend-dot" style="background:#00eeff;color:#00eeff"></span>brainstorm</div>
  <div><span class="legend-dot" style="background:#ffaa00;color:#ffaa00"></span>critique</div>
  <div><span class="legend-dot" style="background:#00ff99;color:#00ff99"></span>file</div>
  <div><span class="legend-dot" style="background:#cc44ff;color:#cc44ff"></span>memory</div>
  <div><span class="legend-dot" style="background:#ff55cc;color:#ff55cc"></span>experiment</div>
  <div><span class="legend-dot" style="background:#00ffcc;color:#00ffcc"></span>self-mod</div>
  <div><span class="legend-dot" style="background:#ff7722;color:#ff7722"></span>error</div>
</div>

<div id="latest-event"></div>
<div id="footer">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; PinPoint Live</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene ──────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000a14, 0.0032);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 28, 95);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ── Controls ───────────────────────────────────────────────
let isDragging = false, prevMouse = { x: 0, y: 0 };
let sph = { theta: 0.4, phi: 1.1, r: 95 };
function applySph() {
  camera.position.set(
    sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(0, 0, 0);
}
applySph();
renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  sph.theta -= (e.clientX - prevMouse.x) * 0.006;
  sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi + (e.clientY - prevMouse.y) * 0.006));
  prevMouse = { x: e.clientX, y: e.clientY };
  applySph();
});
renderer.domElement.addEventListener('wheel', e => {
  sph.r = Math.max(15, Math.min(600, sph.r + e.deltaY * 0.12));
  applySph();
}, { passive: true });

// ── Stars (layered: tiny white + larger teal-tinted) ───────
function addStars(count, spread, size, color, opacity) {
  const pos = [];
  for (let i = 0; i < count; i++) {
    pos.push((Math.random()-0.5)*spread, (Math.random()-0.5)*spread, (Math.random()-0.5)*spread);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color, size, transparent: true, opacity, sizeAttenuation: true
  })));
  return geo;
}
addStars(5000, 2200, 0.5, 0xffffff, 0.45);
addStars(1200, 1800, 1.1, 0x88ffee, 0.25);
addStars(400,  1400, 1.8, 0x4499ff, 0.18);

// ── Nebula background (large translucent spheres) ──────────
[[60, 0x003322, 0.04], [80, 0x000833, 0.05], [55, 0x110022, 0.04]].forEach(([r, c, op]) => {
  const pos = new THREE.Vector3((Math.random()-0.5)*200, (Math.random()-0.5)*100, (Math.random()-0.5)*200);
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r, 16, 16),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op, side: THREE.BackSide })
  );
  m.position.copy(pos);
  scene.add(m);
});

// ── Grid floor ─────────────────────────────────────────────
const grid = new THREE.GridHelper(240, 48, 0x003322, 0x001a22);
grid.position.y = -22;
scene.add(grid);

// ── Lighting ───────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x040d18, 4));
const mindLight = new THREE.PointLight(0x00ccff, 5, 140);
scene.add(mindLight);
const rimA = new THREE.PointLight(0x6600ff, 1.2, 100);
rimA.position.set(-40, 40, -30);
scene.add(rimA);
const rimB = new THREE.PointLight(0x00ffaa, 0.8, 80);
rimB.position.set(50, -20, 40);
scene.add(rimB);

// ── Mind Orb (core + glow shell) ──────────────────────────
const mindCoreMat = new THREE.MeshPhongMaterial({
  color: 0x0099dd, emissive: 0x006699, emissiveIntensity: 1.4,
  transparent: true, opacity: 0.95, shininess: 160
});
const mind = new THREE.Mesh(new THREE.SphereGeometry(4.5, 64, 64), mindCoreMat);
scene.add(mind);

const glowMat = new THREE.MeshBasicMaterial({
  color: 0x00aaff, transparent: true, opacity: 0.08, side: THREE.BackSide
});
const glow = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), glowMat);
scene.add(glow);

// Orbit rings
function makeRing(r, color, tilt, tilt2 = 0) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.12, 8, 120),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 })
  );
  m.rotation.x = tilt;
  m.rotation.z = tilt2;
  scene.add(m);
  return m;
}
const ring1 = makeRing(8,  0x00ccff, 0.3,  0.1);
const ring2 = makeRing(11, 0x0055ff, -0.5, 0.4);
const ring3 = makeRing(6.5,0x44ffcc, 1.1, -0.2);

// ── Color & Shape palette ──────────────────────────────────
const EC = {
  think:        0x8855ff,
  brainstorm:   0x00eeff,
  critique:     0xffaa00,
  decompose:    0x44ffcc,
  tool_call:    0x4499ff,
  tool_result:  0x00ff99,
  error:        0xff7722,   // muted orange — not screaming red
  file_created: 0x00ff88,
  memory:       0xcc44ff,
  goal:         0xffee66,
  experiment:   0xff55cc,
  self_mod:     0x00ffcc,
  session:      0xaaccff,
  default:      0x5588aa,
};

// Status colors: never pure red for the orb
const STATUS_COLORS = {
  thinking: 0xff9900,
  active:   0x0099dd,
  error:    0xff5500,   // orange, not red
  done:     0x00ffaa,
  idle:     0x113355,
};

function makeGeo(type) {
  if (type === 'think')        return new THREE.SphereGeometry(1.2, 24, 24);
  if (type === 'brainstorm')   return new THREE.SphereGeometry(1.4, 24, 24);
  if (type === 'file_created') return new THREE.BoxGeometry(1.8, 1.8, 1.8);
  if (type === 'error')        return new THREE.TetrahedronGeometry(1.3);  // smaller
  if (type === 'experiment')   return new THREE.OctahedronGeometry(1.4);
  if (type === 'self_mod')     return new THREE.IcosahedronGeometry(1.3);
  if (type === 'memory')       return new THREE.DodecahedronGeometry(1.1);
  if (type === 'critique')     return new THREE.ConeGeometry(1.0, 2.0, 6);
  return new THREE.SphereGeometry(0.85, 14, 14);
}

// ── Text Sprites ───────────────────────────────────────────
function makeSprite(text, hexColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 80;
  const ctx = canvas.getContext('2d');
  const css = '#' + hexColor.toString(16).padStart(6, '0');
  ctx.font = '600 20px Courier New';
  ctx.fillStyle = css;
  ctx.shadowColor = css;
  ctx.shadowBlur = 10;
  const t = text.length > 44 ? text.slice(0, 44) + '…' : text;
  ctx.fillText(t, 8, 44);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas), transparent: true,
    depthWrite: false
  }));
  sp.scale.set(13, 2.6, 1);
  return sp;
}

// ── Event Nodes ────────────────────────────────────────────
const activeNodes = [];
const seenIds = new Set();

const LIFETIMES = {
  think: 14000, brainstorm: 18000, critique: 16000,
  file_created: 9e9, memory: 25000,
  tool_result: 10000, error: 12000,   // errors fade faster now
  experiment: 20000, self_mod: 22000,
  default: 12000
};

function spawnNode(ev) {
  if (seenIds.has(ev.id)) return;
  seenIds.add(ev.id);

  const color = EC[ev.type] || EC.default;
  const geo   = makeGeo(ev.type);

  // Errors get lower emissive so they're less blinding
  const isError = ev.type === 'error';
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color,
    emissiveIntensity: isError ? 0.15 : 0.4,
    transparent: true,
    opacity: isError ? 0.7 : 0.92,
    shininess: 100,
    blending: THREE.NormalBlending,
  });
  const mesh = new THREE.Mesh(geo, mat);

  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.random() * Math.PI;
  const dist  = 14 + Math.random() * 40;
  mesh.position.set(
    dist * Math.sin(phi) * Math.cos(theta),
    dist * Math.cos(phi),
    dist * Math.sin(phi) * Math.sin(theta)
  );
  scene.add(mesh);

  const label = makeSprite(ev.label || ev.type, color);
  label.position.copy(mesh.position).add(new THREE.Vector3(0, 3, 0));
  scene.add(label);

  // Beam from mind to node
  const beam = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), mesh.position.clone()]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: isError ? 0.2 : 0.45 })
  );
  scene.add(beam);
  setTimeout(() => scene.remove(beam), 1600);

  const life = LIFETIMES[ev.type] || LIFETIMES.default;
  activeNodes.push({
    mesh, label, born: Date.now(), life,
    axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
    speed: (Math.random() - 0.5) * 0.003,
    ev
  });

  document.getElementById('latest-event').textContent =
    `▶ [${ev.type}] ${ev.label || ''}`;
  mindPulse = 1.0;
}

// ── File Constellation ─────────────────────────────────────
const fileNodes = {};
function syncFiles(files) {
  files.forEach((f) => {
    if (fileNodes[f]) return;
    const idx   = Object.keys(fileNodes).length;
    const angle = (idx / Math.max(files.length, 1)) * Math.PI * 2;
    const ext   = f.split('.').pop().toLowerCase();
    const c = { html: 0x00ff88, py: 0x4499ff, js: 0xffaa00, md: 0xffddaa, txt: 0x88bbcc }[ext] || 0x667799;
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      new THREE.MeshPhongMaterial({ color: c, emissive: c, emissiveIntensity: 0.18, transparent: true, opacity: 0.8 })
    );
    const r = 58 + Math.random() * 14;
    mesh.position.set(Math.cos(angle) * r, -8 + Math.random() * 16, Math.sin(angle) * r);
    const label = makeSprite(f, c);
    label.position.copy(mesh.position).add(new THREE.Vector3(0, 3.5, 0));
    scene.add(mesh); scene.add(label);
    fileNodes[f] = { mesh, label, angle: angle + Math.random() * 0.3, r };
  });
}

// ── Polling ────────────────────────────────────────────────
let _knownViewerVersion = null;

async function poll() {
  try {
    const r = await fetch('world_state.json?_=' + Date.now());
    if (!r.ok) return;
    const s = await r.json();

    const vv = s.viewer_version ?? 0;
    if (_knownViewerVersion === null) _knownViewerVersion = vv;
    else if (vv !== _knownViewerVersion) { location.reload(); return; }

    document.getElementById('session-line').textContent =
      `Session #${s.session || '?'} · Iter ${s.iteration || 0}`;
    document.getElementById('status-badge').textContent = (s.status || 'idle').toUpperCase();
    document.getElementById('goal-text').textContent =
      s.goal ? s.goal.slice(0, 90) + (s.goal.length > 90 ? '…' : '') : '—';
    document.getElementById('stats-line').textContent =
      `Events: ${(s.events||[]).length} · Files: ${(s.files||[]).length} · Memories: ${s.memories||0}`;

    const sc = STATUS_COLORS[s.status] || STATUS_COLORS.idle;
    mindCoreMat.color.setHex(sc);
    mindCoreMat.emissive.setHex(sc);
    mindLight.color.setHex(sc);

    (s.events || []).forEach(spawnNode);
    syncFiles(s.files || []);
  } catch (_) {}
}

setInterval(poll, 800);
poll();

// ── Animation ──────────────────────────────────────────────
const clock = new THREE.Clock();
let mindPulse = 0;

// Twinkle state for stars
const twinkleOffset = Math.random() * 100;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Mind orb pulse + glow
  mindPulse *= 0.90;
  const ps = 1 + 0.05 * Math.sin(t * 2.6) + mindPulse * 0.35;
  mind.scale.setScalar(ps);
  glow.scale.setScalar(ps * (1 + 0.08 * Math.sin(t * 1.3)));
  mindLight.intensity = 3 + 2 * Math.sin(t * 2.8) + mindPulse * 4;
  glowMat.opacity = 0.06 + 0.03 * Math.sin(t * 1.7) + mindPulse * 0.05;

  // Rings
  ring1.rotation.x = t * 0.22; ring1.rotation.z = t * 0.13;
  ring2.rotation.y = t * 0.18; ring2.rotation.z = t * 0.27;
  ring3.rotation.x = -t * 0.16; ring3.rotation.y = t * 0.20;

  // Rim lights drift
  rimA.position.set(-40 + Math.sin(t*0.3)*15, 40, -30 + Math.cos(t*0.2)*15);
  rimB.position.set(50 + Math.cos(t*0.25)*10, -20, 40 + Math.sin(t*0.35)*10);

  // Event nodes
  const now = Date.now();
  for (let i = activeNodes.length - 1; i >= 0; i--) {
    const n = activeNodes[i];
    const age = now - n.born;
    if (age > n.life) {
      if (n.ev.type !== 'file_created') {
        scene.remove(n.mesh); scene.remove(n.label);
        activeNodes.splice(i, 1);
      }
      continue;
    }
    const fade = age > n.life * 0.7 ? 1 - (age - n.life * 0.7) / (n.life * 0.3) : 1;
    n.mesh.material.opacity = Math.max(0, fade * (n.ev.type === 'error' ? 0.65 : 0.9));
    n.label.material.opacity = Math.max(0, fade * 0.85);
    n.mesh.position.applyAxisAngle(n.axis, n.speed);
    n.label.position.copy(n.mesh.position).add(new THREE.Vector3(0, 3, 0));
    n.mesh.rotation.x += 0.007;
    n.mesh.rotation.y += 0.010;
  }

  // File constellation
  Object.values(fileNodes).forEach(fn => {
    fn.angle += 0.0007;
    fn.mesh.position.x = Math.cos(fn.angle) * fn.r;
    fn.mesh.position.z = Math.sin(fn.angle) * fn.r;
    fn.label.position.copy(fn.mesh.position).add(new THREE.Vector3(0, 3.5, 0));
    fn.mesh.rotation.y += 0.009;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
