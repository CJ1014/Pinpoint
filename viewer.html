<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PinPoint — Live 3D Mind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 18px;
    color: #88ccff; font-size: 12px; pointer-events: none;
    line-height: 1.8; z-index: 10;
    text-shadow: 0 0 6px #0af;
  }
  #hud .label { color: #446688; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #goal-text { color: #ffcc44; max-width: 380px; word-break: break-word; margin-top: 4px; }
  #status-badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    background: #112233; border: 1px solid #0af; font-size: 11px;
    margin-top: 6px; letter-spacing: 1px;
  }

  #legend {
    position: fixed; top: 18px; right: 18px; color: #667788;
    font-size: 11px; pointer-events: none; z-index: 10; line-height: 2;
    text-align: right;
  }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 5px; vertical-align: middle;
  }

  #footer {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #334455; font-size: 11px; pointer-events: none; letter-spacing: 1px;
  }

  #latest-event {
    position: fixed; bottom: 40px; left: 18px; right: 18px;
    color: #99aabb; font-size: 11px; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 4px #036;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="label">PinPoint Live</div>
  <div id="session-line">Session #— | Iteration —</div>
  <div id="status-badge" id="status-text">connecting…</div>
  <div style="margin-top:10px;" class="label">Current Goal</div>
  <div id="goal-text">—</div>
  <div style="margin-top:10px;" class="label">Stats</div>
  <div id="stats-line">Events: — | Files: —</div>
</div>

<div id="legend">
  <div><span class="legend-dot" style="background:#ff8800"></span>think</div>
  <div><span class="legend-dot" style="background:#ffaa00"></span>brainstorm</div>
  <div><span class="legend-dot" style="background:#ff4466"></span>critique</div>
  <div><span class="legend-dot" style="background:#00ddff"></span>tool call</div>
  <div><span class="legend-dot" style="background:#00ff88"></span>success</div>
  <div><span class="legend-dot" style="background:#ff2200"></span>error</div>
  <div><span class="legend-dot" style="background:#88ff00"></span>file</div>
  <div><span class="legend-dot" style="background:#aa44ff"></span>memory</div>
  <div><span class="legend-dot" style="background:#ff66aa"></span>experiment</div>
</div>

<div id="latest-event"></div>
<div id="footer">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; PinPoint Live 3D</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Scene & Renderer
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000308, 0.004);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 25, 90);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Orbit Controls (inline — no import needed)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let isDragging = false, prevMouse = { x: 0, y: 0 };
let sph = { theta: 0.4, phi: 1.1, r: 90 };

function applySph() {
  camera.position.set(
    sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(0, 0, 0);
}
applySph();

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  sph.theta -= (e.clientX - prevMouse.x) * 0.006;
  sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi + (e.clientY - prevMouse.y) * 0.006));
  prevMouse = { x: e.clientX, y: e.clientY };
  applySph();
});
renderer.domElement.addEventListener('wheel', e => {
  sph.r = Math.max(15, Math.min(500, sph.r + e.deltaY * 0.12));
  applySph();
}, { passive: true });

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Stars
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const starPos = [];
for (let i = 0; i < 4000; i++) {
  starPos.push((Math.random() - 0.5) * 1800, (Math.random() - 0.5) * 1800, (Math.random() - 0.5) * 1800);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.55 })));

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Grid floor
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const grid = new THREE.GridHelper(200, 40, 0x001133, 0x001133);
grid.position.y = -20;
scene.add(grid);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Lighting
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
scene.add(new THREE.AmbientLight(0x050818, 3));
const mindLight = new THREE.PointLight(0x0088ff, 4, 120);
scene.add(mindLight);
const rimLight = new THREE.PointLight(0xff6600, 1.5, 80);
rimLight.position.set(30, 30, -20);
scene.add(rimLight);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Central Mind Orb
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const mindMat = new THREE.MeshPhongMaterial({
  color: 0x0066cc, emissive: 0x003388, emissiveIntensity: 1,
  transparent: true, opacity: 0.88, shininess: 120
});
const mind = new THREE.Mesh(new THREE.SphereGeometry(5, 48, 48), mindMat);
scene.add(mind);

// Orbit rings
function makeRing(r, color, tilt) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.15, 8, 100),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25 })
  );
  m.rotation.x = tilt;
  scene.add(m);
  return m;
}
const ring1 = makeRing(9, 0x0088ff, 0.3);
const ring2 = makeRing(12, 0x0044ff, -0.5);
const ring3 = makeRing(7, 0x00aaff, 1.1);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Event Colors & Shapes
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const EC = {
  think:        0xff8800,
  brainstorm:   0xffcc00,
  critique:     0xff4466,
  decompose:    0x44ffcc,
  tool_call:    0x00ddff,
  tool_result:  0x00ff88,
  error:        0xff2200,
  file_created: 0x88ff00,
  memory:       0xaa44ff,
  goal:         0xffee00,
  experiment:   0xff66aa,
  self_mod:     0x88ffff,
  session:      0xffffff,
  default:      0x8899bb,
};

function makeGeo(type) {
  if (type === 'think' || type === 'brainstorm') return new THREE.SphereGeometry(1.3, 20, 20);
  if (type === 'file_created') return new THREE.BoxGeometry(2, 2, 2);
  if (type === 'error') return new THREE.TetrahedronGeometry(1.6);
  if (type === 'experiment') return new THREE.OctahedronGeometry(1.5);
  if (type === 'self_mod') return new THREE.IcosahedronGeometry(1.4);
  if (type === 'memory') return new THREE.DodecahedronGeometry(1.2);
  if (type === 'critique') return new THREE.ConeGeometry(1.2, 2.2, 6);
  return new THREE.SphereGeometry(0.9, 14, 14);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Text Sprites
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function makeSprite(text, hexColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  const css = '#' + hexColor.toString(16).padStart(6, '0');
  ctx.font = 'bold 22px Courier New';
  ctx.fillStyle = css;
  ctx.shadowColor = css;
  ctx.shadowBlur = 12;
  const t = text.length > 42 ? text.slice(0, 42) + '…' : text;
  ctx.fillText(t, 8, 44);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
  sp.scale.set(14, 3, 1);
  return sp;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Event Node Pool
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const activeNodes = [];
const seenIds = new Set();

const LIFETIMES = {
  think: 14000, brainstorm: 18000, critique: 16000,
  file_created: 9e9, memory: 25000,
  tool_result: 10000, error: 20000,
  experiment: 20000, self_mod: 20000,
  default: 12000
};

function spawnNode(ev) {
  if (seenIds.has(ev.id)) return;
  seenIds.add(ev.id);

  const color = EC[ev.type] || EC.default;
  const geo = makeGeo(ev.type);
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.35,
    transparent: true, opacity: 0.92, shininess: 80
  });
  const mesh = new THREE.Mesh(geo, mat);

  // Start near mind, fly outward
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.random() * Math.PI;
  const dist  = 16 + Math.random() * 38;
  mesh.position.set(
    dist * Math.sin(phi) * Math.cos(theta),
    dist * Math.cos(phi),
    dist * Math.sin(phi) * Math.sin(theta)
  );
  scene.add(mesh);

  const label = makeSprite(ev.label || ev.type, color);
  label.position.copy(mesh.position).add(new THREE.Vector3(0, 3, 0));
  scene.add(label);

  // Beam from mind to node
  const pts = [new THREE.Vector3(0,0,0), mesh.position.clone()];
  const beam = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 })
  );
  scene.add(beam);
  setTimeout(() => scene.remove(beam), 1800);

  const life = LIFETIMES[ev.type] || LIFETIMES.default;
  activeNodes.push({
    mesh, label,
    born: Date.now(), life,
    axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
    speed: (Math.random() - 0.5) * 0.004,
    ev
  });

  // Update latest event footer
  document.getElementById('latest-event').textContent =
    `▶ [${ev.type}] ${ev.label || ''}`;

  // Kick mind glow
  mindPulse = 1.0;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// File Constellation (outer ring)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const fileNodes = {};

function syncFiles(files) {
  files.forEach((f, i) => {
    if (fileNodes[f]) return;
    const angle = (Object.keys(fileNodes).length / Math.max(files.length, 1)) * Math.PI * 2;
    const ext = f.split('.').pop().toLowerCase();
    const c = { html: 0x00ff88, py: 0x4499ff, js: 0xffaa00, md: 0xffddaa, txt: 0xaabbcc }[ext] || 0x8899aa;
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 1.6, 1.6),
      new THREE.MeshPhongMaterial({ color: c, emissive: c, emissiveIntensity: 0.2, transparent: true, opacity: 0.85 })
    );
    const r = 58 + Math.random() * 12;
    mesh.position.set(Math.cos(angle) * r, -8 + Math.random() * 16, Math.sin(angle) * r);
    const label = makeSprite(f, c);
    label.position.copy(mesh.position).add(new THREE.Vector3(0, 3.5, 0));
    scene.add(mesh); scene.add(label);
    fileNodes[f] = { mesh, label, angle: angle + Math.random() * 0.3, r };
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// State Polling
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const STATUS_COLORS = {
  thinking: 0xff6600, active: 0x0088ff,
  error: 0xff0000, done: 0x00ff44, idle: 0x224466
};

async function poll() {
  try {
    const r = await fetch('world_state.json?_=' + Date.now());
    if (!r.ok) return;
    const s = await r.json();

    document.getElementById('session-line').textContent =
      `Session #${s.session || '?'} · Iter ${s.iteration || 0}`;
    document.getElementById('status-badge').textContent = (s.status || 'idle').toUpperCase();
    document.getElementById('goal-text').textContent =
      s.goal ? s.goal.slice(0, 80) + (s.goal.length > 80 ? '…' : '') : '—';
    document.getElementById('stats-line').textContent =
      `Events: ${(s.events || []).length} · Files: ${(s.files || []).length} · Memories: ${s.memories || 0}`;

    const sc = STATUS_COLORS[s.status] || STATUS_COLORS.idle;
    mindMat.color.setHex(sc);
    mindMat.emissive.setHex(sc);
    mindLight.color.setHex(sc);

    (s.events || []).forEach(spawnNode);
    syncFiles(s.files || []);
  } catch (_) {}
}

setInterval(poll, 800);
poll();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Animation Loop
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const clock = new THREE.Clock();
let mindPulse = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Mind pulse
  mindPulse *= 0.92;
  const ps = 1 + 0.06 * Math.sin(t * 2.8) + mindPulse * 0.4;
  mind.scale.setScalar(ps);
  mindLight.intensity = 2.5 + 1.5 * Math.sin(t * 3) + mindPulse * 3;

  // Orbit rings
  ring1.rotation.x = t * 0.25;
  ring1.rotation.z = t * 0.15;
  ring2.rotation.y = t * 0.20;
  ring2.rotation.z = t * 0.30;
  ring3.rotation.x = -t * 0.18;
  ring3.rotation.y =  t * 0.22;

  const now = Date.now();
  for (let i = activeNodes.length - 1; i >= 0; i--) {
    const n = activeNodes[i];
    const age = now - n.born;
    if (age > n.life) {
      if (n.ev.type !== 'file_created') {
        scene.remove(n.mesh); scene.remove(n.label);
        activeNodes.splice(i, 1);
      }
      continue;
    }
    const fade = age > n.life * 0.7 ? 1 - (age - n.life * 0.7) / (n.life * 0.3) : 1;
    n.mesh.material.opacity = Math.max(0, fade * 0.92);
    n.label.material.opacity = Math.max(0, fade * 0.9);
    n.mesh.position.applyAxisAngle(n.axis, n.speed);
    n.label.position.copy(n.mesh.position).add(new THREE.Vector3(0, 3, 0));
    n.mesh.rotation.x += 0.008;
    n.mesh.rotation.y += 0.012;
  }

  // File constellation slow-orbit
  Object.values(fileNodes).forEach(fn => {
    fn.angle += 0.0008;
    fn.mesh.position.x = Math.cos(fn.angle) * fn.r;
    fn.mesh.position.z = Math.sin(fn.angle) * fn.r;
    fn.label.position.copy(fn.mesh.position).add(new THREE.Vector3(0, 3.5, 0));
    fn.mesh.rotation.y += 0.01;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
