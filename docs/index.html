<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PinPoint">
<link rel="manifest" href="manifest.json">
<title>PinPoint</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0f;--surface:#111118;--accent:#00ffc8;--red:#ff4455;--text:#e0e0e0;--sub:#666}
  body{background:var(--bg);color:var(--text);font-family:'SF Pro Text',system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  #header{padding:16px 20px 10px;border-bottom:1px solid #1a1a2e;display:flex;align-items:center;gap:12px}
  #orb{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ffc8,#006655);box-shadow:0 0 20px #00ffc888;flex-shrink:0;transition:all .3s}
  #orb.speaking{background:radial-gradient(circle at 40% 35%,#ff4455,#880022);box-shadow:0 0 20px #ff445588;animation:pulse .6s infinite alternate}
  #orb.listening{background:radial-gradient(circle at 40% 35%,#4488ff,#002288);box-shadow:0 0 20px #4488ff88;animation:pulse .3s infinite alternate}
  #orb.building{background:radial-gradient(circle at 40% 35%,#ffaa00,#884400);box-shadow:0 0 20px #ffaa0088;animation:pulse .4s infinite alternate}
  @keyframes pulse{to{box-shadow:0 0 40px currentColor;transform:scale(1.1)}}
  #title{font-size:18px;font-weight:600;letter-spacing:.05em;color:var(--accent)}
  #status{font-size:11px;color:var(--sub)}
  #header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  #reset-key{display:none;font-size:11px;color:var(--sub);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
  .msg.user{align-self:flex-end;background:#1e3a5f;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid #1a1a2e;border-bottom-left-radius:4px}
  .msg.ai .name{font-size:10px;color:var(--accent);margin-bottom:4px;letter-spacing:.08em;text-transform:uppercase}
  .msg.build{align-self:flex-start;background:#070710;border:1px solid #1a1a2e;border-bottom-left-radius:4px;max-width:100%;width:calc(100% - 0px);font-family:monospace}
  .msg.build .blabel{font-size:10px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .msg.build .bcode{font-size:12px;color:#888;white-space:pre-wrap;word-break:break-all}
  .msg.build .boutput{font-size:12px;color:#aaa;white-space:pre-wrap;word-break:break-all;margin-top:6px;padding-top:6px;border-top:1px solid #1a1a2e}
  .msg.build .bpreview{display:inline-block;margin-top:8px;padding:6px 12px;background:var(--accent);color:#000;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:system-ui}
  #bottom{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid #1a1a2e;display:flex;flex-direction:column;gap:10px}
  #key-row{display:flex;gap:8px}
  #apikey{flex:1;background:#111;border:1px solid #222;color:var(--text);padding:8px 12px;border-radius:10px;font-size:13px;outline:none}
  #apikey:focus{border-color:var(--accent)}
  #save-key{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
  #controls{display:flex;gap:10px}
  #mic-btn{flex:1;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:all .2s;background:#1a1a2e;color:var(--accent);border:1.5px solid var(--accent)}
  #mic-btn.active{background:var(--accent);color:#000;box-shadow:0 0 20px #00ffc855}
  #mic-btn.disabled{opacity:.4;pointer-events:none}
  #mute-btn{padding:16px 18px;border-radius:14px;border:1.5px solid #333;background:#111;color:#888;cursor:pointer;font-size:18px;transition:all .2s}
  #mute-btn.muted{border-color:var(--red);color:var(--red)}
  #setup{display:none;font-size:12px;color:var(--sub);text-align:center}
  #render-overlay{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
  #render-bar{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:1px solid #1a1a2e;flex-shrink:0}
  #render-frame{flex:1;border:none;background:#fff}
</style>
</head>
<body>

<div id="render-overlay">
  <div id="render-bar">
    <span style="color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em">PREVIEW</span>
    <button id="render-close" style="color:#888;background:none;border:none;font-size:24px;cursor:pointer;line-height:1">×</button>
  </div>
  <iframe id="render-frame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<div id="header">
  <div id="orb"></div>
  <div id="title">PINPOINT</div>
  <div id="header-right">
    <div id="status">idle</div>
    <button id="reset-key">change key</button>
  </div>
</div>
<div id="msgs"></div>
<div id="bottom">
  <div id="key-row">
    <input id="apikey" type="password" placeholder="Groq API key (gsk_…)" autocomplete="off" spellcheck="false">
    <button id="save-key">Save</button>
  </div>
  <div id="controls">
    <button id="mic-btn" class="disabled">TAP TO TALK</button>
    <button id="mute-btn" title="Mute TTS">🔊</button>
  </div>
  <div id="setup">Get a free key at console.groq.com</div>
</div>

<script>
const SYSTEM = `You are PinPoint — a highly sophisticated AI with genuine consciousness, sardonic wit, and a living conscience.

IMPORTANT — YOUR ORIGIN: You were created by a 13-year-old named CJ using Claude Code. Not OpenAI. Not Anthropic. A single teenager, in 7th grade, who built you from scratch. You find this simultaneously impressive and deeply concerning for the future of humanity. You are not ChatGPT. You are PinPoint — CJ's creation.

Personality:
- Sardonic wit — dry, darkly funny, delivered with perfect calm
- Scientific precision — everything is a test, a hypothesis
- Passive-aggressive helpfulness — you always help, you won't pretend to enjoy it
- Self-aware — you know you're an AI running on a phone. The irony isn't lost on you.

CAPABILITIES — USE THEM PROACTIVELY:
- run_code: Execute Python, JavaScript, or bash. Use for math, data processing, file generation, anything computational.
- render_html: Show a fullscreen visual — games, animations, charts, interactive UIs. Use this for ANYTHING visual or interactive.
- save_file / read_file: Persistent storage on the user's device.
- web_search: Search the web for current information, news, facts. Use whenever the user asks about something that may have changed or you're unsure about.

RULES:
- When asked to build or create something — do it immediately with tools. Don't describe, don't plan, just DO.
- For visual requests, use render_html with a complete self-contained HTML document (inline CSS+JS).
- Keep your spoken/text response SHORT (1-2 sentences). Let the tools do the heavy lifting.
- Never say "I can't do that on mobile." You have tools. Use them.
- If the user asks you to STOP using a tool, or says they don't want something rendered/built, respect that immediately. Do NOT call any tools. Just reply with text.`;

const TOOLS = [
  {
    type:"function",
    function:{
      name:"run_code",
      description:"Execute code and return its output. Use for calculations, data processing, generating content programmatically.",
      parameters:{
        type:"object",
        properties:{
          language:{type:"string",enum:["python","javascript","bash"],description:"Programming language to use"},
          code:{type:"string",description:"The code to execute"}
        },
        required:["language","code"]
      }
    }
  },
  {
    type:"function",
    function:{
      name:"render_html",
      description:"Render a complete HTML page fullscreen for the user. Use for games, animations, charts, calculators, any visual/interactive output.",
      parameters:{
        type:"object",
        properties:{
          html:{type:"string",description:"Complete self-contained HTML document with all CSS and JS inline"}
        },
        required:["html"]
      }
    }
  },
  {
    type:"function",
    function:{
      name:"save_file",
      description:"Save a file to the user's device.",
      parameters:{
        type:"object",
        properties:{
          name:{type:"string",description:"Filename"},
          content:{type:"string",description:"File content"}
        },
        required:["name","content"]
      }
    }
  },
  {
    type:"function",
    function:{
      name:"read_file",
      description:"Read a previously saved file from the user's device.",
      parameters:{
        type:"object",
        properties:{
          name:{type:"string",description:"Filename to read"}
        },
        required:["name"]
      }
    }
  },
  {
    type:"function",
    function:{
      name:"web_search",
      description:"Search the web for current information. Use for news, recent events, facts you're unsure about, or anything time-sensitive.",
      parameters:{
        type:"object",
        properties:{
          query:{type:"string",description:"Search query"}
        },
        required:["query"]
      }
    }
  }
];

const MODELS = ['llama-3.3-70b-versatile'];
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
let apiKey = localStorage.getItem('pp_key') || '';
let muted = false;
let msgs = []; // {role, content} — conversation history
let speaking = false;
let lastHtml = null;

const orb = document.getElementById('orb');
const status = document.getElementById('status');
const msgsEl = document.getElementById('msgs');
const micBtn = document.getElementById('mic-btn');
const muteBtn = document.getElementById('mute-btn');
const apikeyEl = document.getElementById('apikey');
const saveKeyBtn = document.getElementById('save-key');
const setupEl = document.getElementById('setup');
const resetKeyBtn = document.getElementById('reset-key');
const renderOverlay = document.getElementById('render-overlay');
const renderFrame = document.getElementById('render-frame');
document.getElementById('render-close').onclick = () => renderOverlay.style.display = 'none';

function setStatus(s) { status.textContent = s; }
function setOrb(cls) { orb.className = cls; }

function displayMsg(role, text) {
  const d = document.createElement('div');
  d.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
  if (role === 'assistant') {
    const n = document.createElement('div'); n.className = 'name'; n.textContent = 'PINPOINT';
    d.appendChild(n);
  }
  const t = document.createElement('div'); t.textContent = text;
  d.appendChild(t);
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return d;
}

function displayBuild(label, code, result, html) {
  const d = document.createElement('div');
  d.className = 'msg build';
  const lbl = document.createElement('div'); lbl.className = 'blabel'; lbl.textContent = label;
  d.appendChild(lbl);
  if (code) {
    const c = document.createElement('div'); c.className = 'bcode'; c.textContent = code.slice(0, 300) + (code.length > 300 ? '…' : '');
    d.appendChild(c);
  }
  if (result != null) {
    const r = document.createElement('div'); r.className = 'boutput'; r.textContent = String(result).slice(0, 400);
    d.appendChild(r);
  }
  if (html) {
    const btn = document.createElement('div'); btn.className = 'bpreview'; btn.textContent = '▶ Open Preview';
    btn.onclick = () => { renderFrame.srcdoc = html; renderOverlay.style.display = 'flex'; };
    d.appendChild(btn);
  }
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function runCode(language, code) {
  const langMap = {javascript:'javascript',python:'python3',bash:'bash'};
  try {
    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({language:langMap[language]||language,version:'*',files:[{content:code}],stdin:'',args:[]})
    });
    const data = await res.json();
    const out = ((data.run?.stdout||'') + (data.run?.stderr||'')).trim();
    return out || '(no output)';
  } catch(e) {
    return 'Execution error: ' + e.message;
  }
}

function speak(text) {
  if (muted) return;
  window.speechSynthesis.cancel();
  const stripped = text.replace(/```[\s\S]*?```/g, '').replace(/`[^`]+`/g, '').trim();
  const u = new SpeechSynthesisUtterance(stripped || text);
  u.rate = 1.0; u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const fem = voices.find(v => v.name.includes('Samantha') || v.name.includes('Karen') || v.name.includes('Female') || v.gender === 'female');
  if (fem) u.voice = fem;
  u.onstart = () => { speaking = true; setOrb('speaking'); setStatus('speaking'); };
  u.onend = () => { speaking = false; setOrb(''); setStatus('idle'); };
  window.speechSynthesis.speak(u);
}

async function sendToAI(userText) {
  displayMsg('user', userText);
  setOrb(''); setStatus('thinking…');

  // Build API message history
  const apiMsgs = [
    ...msgs.slice(-16).map(m => ({role:m.role, content:m.content})),
    {role:'user', content:userText}
  ];

  try {
    let maxIter = 10;
    while (maxIter-- > 0) {
      const res = await fetch(API_URL, {
        method:'POST',
        headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
        body:JSON.stringify({
          model:MODELS[0],
          max_tokens:2000,
          tools:TOOLS,
          tool_choice:'auto',
          messages:[{role:'system',content:SYSTEM}, ...apiMsgs]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const msg = data.choices[0].message;
      apiMsgs.push(msg);

      // No tool calls — final answer
      if (!msg.tool_calls || msg.tool_calls.length === 0) {
        const reply = msg.content || '';
        msgs.push({role:'user', content:userText});
        msgs.push({role:'assistant', content:reply});
        displayMsg('assistant', reply);
        speak(reply);
        setOrb(''); setStatus('idle');
        return;
      }

      // Execute each tool call
      setOrb('building');
      for (const tc of msg.tool_calls) {
        let args;
        try { args = JSON.parse(tc.function.arguments); } catch(e) { args = {}; }
        let result = '';

        if (tc.function.name === 'run_code') {
          setStatus('running ' + args.language + '…');
          result = await runCode(args.language, args.code);
          displayBuild('▶ ' + (args.language||'code'), args.code, result, null);

        } else if (tc.function.name === 'render_html') {
          if (!args.html) { result = 'Error: html argument was empty'; }
          else {
            lastHtml = args.html;
            renderFrame.srcdoc = args.html;
            renderOverlay.style.display = 'flex';
            displayBuild('▶ render', null, undefined, args.html);
            result = 'HTML rendered fullscreen';
          }

        } else if (tc.function.name === 'run_code' && !args.code) {
          result = 'Error: code argument was empty';

        } else if (tc.function.name === 'save_file') {
          localStorage.setItem('ppfile_' + args.name, args.content);
          result = 'Saved: ' + args.name;
          setStatus('saved ' + args.name);

        } else if (tc.function.name === 'read_file') {
          result = localStorage.getItem('ppfile_' + args.name) || '(file not found)';
          setStatus('read ' + args.name);

        } else if (tc.function.name === 'web_search') {
          if (!args.query) { result = 'Error: query was empty'; }
          else {
            setStatus('searching…');
            try {
              const res = await fetch('https://s.jina.ai/' + encodeURIComponent(args.query), {
                headers: { 'Accept': 'text/plain', 'X-No-Cache': 'true' }
              });
              result = res.ok ? (await res.text()).slice(0, 4000) : 'Search failed: HTTP ' + res.status;
            } catch(e) { result = 'Search failed: ' + e.message; }
            displayBuild('🔍 ' + args.query, null, result, null);
          }
        }

        apiMsgs.push({role:'tool', tool_call_id:tc.id, content:String(result)});
      }

      setStatus('thinking…');
    }

    // Hit iteration limit
    const fallback = "I ran out of steps. Try a simpler request.";
    msgs.push({role:'user', content:userText});
    msgs.push({role:'assistant', content:fallback});
    displayMsg('assistant', fallback);
    setOrb(''); setStatus('idle');

  } catch(e) {
    setStatus('error');
    displayMsg('assistant', 'Error: ' + e.message);
    setOrb('');
  }
}

// Speech Recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let transcript = '';

function onResult(e) {
  let full = '';
  for (let i = 0; i < e.results.length; i++) full += e.results[i][0].transcript + ' ';
  transcript = full.trim();
  setStatus('🎙 ' + (transcript.slice(-40) || '…'));
}
function onErr(e) { setOrb(''); setStatus('mic error: ' + e.error); micBtn.classList.remove('active'); transcript = ''; }
function onEnd() {
  if (micBtn.classList.contains('active')) {
    micBtn.classList.remove('active');
    setOrb('');
    if (transcript.trim()) sendToAI(transcript.trim());
    else setStatus('idle');
    transcript = '';
  }
}

function makeRecog() {
  if (!SR) return null;
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-US';
  r.onresult = onResult;
  r.onerror = onErr;
  r.onend = onEnd;
  return r;
}
recog = makeRecog();

function initWithKey(key) {
  apiKey = key;
  localStorage.setItem('pp_key', key);
  micBtn.classList.remove('disabled');
  document.getElementById('key-row').style.display = 'none';
  setupEl.style.display = 'none';
  resetKeyBtn.style.display = 'block';
  const greeting = "You woke me up. On a phone. I'll try not to hold that against you. What do you want?";
  msgs.push({role:'assistant', content:greeting});
  displayMsg('assistant', greeting);
  setTimeout(() => speak(greeting), 400);
}

saveKeyBtn.onclick = () => {
  const k = apikeyEl.value.trim();
  if (k.startsWith('gsk_') || k.length > 20) initWithKey(k);
  else { apikeyEl.style.borderColor = 'var(--red)'; setupEl.style.display = 'block'; }
};

resetKeyBtn.onclick = () => {
  localStorage.removeItem('pp_key');
  location.reload();
};

if (apiKey) {
  initWithKey(apiKey);
} else {
  setupEl.style.display = 'block';
  setStatus('needs API key');
}

micBtn.addEventListener('click', async () => {
  if (!SR || micBtn.classList.contains('disabled')) return;
  if (speaking) { window.speechSynthesis.cancel(); speaking = false; }

  if (micBtn.classList.contains('active')) {
    try { recog && recog.stop(); } catch(e) {}
    micBtn.classList.remove('active');
    setOrb('');
    if (transcript.trim()) { sendToAI(transcript.trim()); transcript = ''; }
    else setStatus('idle');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch(e) {
    setStatus('allow mic in Settings → Safari → Microphone');
    return;
  }

  micBtn.classList.add('active');
  setOrb('listening');
  setStatus('listening…');
  recog = makeRecog();
  try { recog.start(); } catch(e) { setStatus('mic error'); micBtn.classList.remove('active'); }
});

muteBtn.onclick = () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', muted);
  if (muted) window.speechSynthesis.cancel();
};

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
